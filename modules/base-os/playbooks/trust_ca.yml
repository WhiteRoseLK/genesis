---
# TrustCA (functions/os/base/v1): installs the root CA in the system
# certificate store (Debian cloud image, docs/01-vision-scope.md).
- hosts: target
  gather_facts: false
  become: true
  tasks:
    - name: install the CA certificate
      ansible.builtin.copy:
        content: "{{ ca_cert_pem }}"
        dest: /usr/local/share/ca-certificates/genesis-root-ca.crt
        mode: "0644"
      register: ca_file

    - name: update the certificate store
      ansible.builtin.command: update-ca-certificates
      when: ca_file.changed
      changed_when: true
