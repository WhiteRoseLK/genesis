---
# SetNTP (functions/os/base/v1) : pointe la synchronisation d'horloge de la
# VM vers le fournisseur actif (docs/03-contrat-module.md, appelé aussi en
# Repoint). systemd-timesyncd : présent par défaut sur l'image cloud Debian
# (docs/01-vision-perimetre.md) tant que le module chrony (J6) ne l'a pas
# remplacé sur les VM qui l'hébergent.
- hosts: target
  gather_facts: false
  become: true
  tasks:
    - name: configurer les serveurs NTP
      ansible.builtin.lineinfile:
        path: /etc/systemd/timesyncd.conf
        regexp: '^#?NTP='
        line: "NTP={{ ntp_servers | join(' ') }}"
        create: true
      register: timesyncd_conf

    - name: redémarrer systemd-timesyncd
      ansible.builtin.systemd:
        name: systemd-timesyncd
        state: restarted
      when: timesyncd_conf.changed
