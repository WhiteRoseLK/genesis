---
# SetNTP (functions/os/base/v1): points the VM's clock synchronisation to the
# active provider (docs/03-module-contract.md, also called during Repoint).
# systemd-timesyncd: present by default on the Debian cloud image
# (docs/01-vision-scope.md) until the chrony module (M6) replaces it on the
# VMs that host it.
- hosts: target
  gather_facts: false
  become: true
  tasks:
    - name: configure the NTP servers
      ansible.builtin.lineinfile:
        path: /etc/systemd/timesyncd.conf
        regexp: '^#?NTP='
        line: "NTP={{ ntp_servers | join(' ') }}"
        create: true
      register: timesyncd_conf

    - name: restart systemd-timesyncd
      ansible.builtin.systemd:
        name: systemd-timesyncd
        state: restarted
      when: timesyncd_conf.changed
