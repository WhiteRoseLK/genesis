---
# SetResolver (functions/os/base/v1): points the VM's DNS resolution to the
# active provider (docs/03-module-contract.md, also called during Repoint).
- hosts: target
  gather_facts: false
  become: true
  tasks:
    - name: configure the DNS resolver
      ansible.builtin.copy:
        content: |
          {% for ns in nameservers %}
          nameserver {{ ns }}
          {% endfor %}
          {% if domain %}
          search {{ domain }}
          {% endif %}
        dest: /etc/resolv.conf
        mode: "0644"
