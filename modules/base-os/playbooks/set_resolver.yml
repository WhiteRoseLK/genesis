---
# SetResolver (functions/os/base/v1) : pointe la résolution DNS de la VM vers
# le fournisseur actif (docs/03-contrat-module.md, appelé aussi en Repoint).
- hosts: target
  gather_facts: false
  become: true
  tasks:
    - name: configurer le résolveur DNS
      ansible.builtin.copy:
        content: |
          {% for ns in nameservers %}
          nameserver {{ ns }}
          {% endfor %}
          {% if domain %}
          search {{ domain }}
          {% endif %}
        dest: /etc/resolv.conf
        mode: "0644"
