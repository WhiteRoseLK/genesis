apiVersion: genesis/module/v1
name: teleport
version: 0.1.0
description: "Target \"fleet\" bastion (docs/07-mvp-modules.md): access.ssh/v1 and fleet.agent/v1 (ADR-017), Teleport Auth+Proxy on its own VM, SSH agent installed on every fleet VM through fleet.agent/v1.Install"
layer: services
core: ">=0.1.0 <0.3.0"
protocol: 1

capabilities: []

provides:
  - function: access.ssh/v1
    phases: [target]
  - function: fleet.agent/v1
    phases: [target]
    fleet: true

requires:
  target:
    - function: compute.vm/v1
    - function: os.base/v1
    - function: core.ansible/v1
    - function: core.secrets/v1
    - function: time.ntp/v1
    - function: dns.resolver/v1
    - function: pki.issuer/v1

config_schema: schema.json

secrets: []

resources:
  - { role: teleport, count: 1, size: medium }

defaults: {}
