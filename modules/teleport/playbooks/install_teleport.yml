# Configure (functions/access/ssh/v1 + fleet/agent/v1, teleport module):
# installs Teleport (Auth + Proxy, official Teleport APT repository), places
# the TLS certificate issued by pki.issuer/v1 (resolved to vault, doc 07), then
# reads the pin of Teleport's internal CA (tctl status) -- reused by
# fleet.agent/v1.Install for each enrolment (docs/09-decisions.md
# ADR-017/ADR-018). Idempotent: can be replayed without change if already
# installed.
- hosts: target
  gather_facts: true
  become: true
  tasks:
    - name: install the prerequisites
      ansible.builtin.apt:
        name: [gnupg, curl, ca-certificates]
        state: present
        update_cache: true

    - name: create the APT keys directory
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"

    - name: add the Teleport GPG key
      ansible.builtin.get_url:
        url: https://apt.releases.teleport.dev/gpg
        dest: /usr/share/keyrings/teleport-archive-keyring.asc
        mode: "0644"

    - name: add the Teleport repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/teleport-archive-keyring.asc] https://apt.releases.teleport.dev/debian/ {{ ansible_distribution_release | default('bookworm') }} stable/v17"
        state: present
        filename: teleport

    - name: install teleport
      ansible.builtin.apt:
        name: teleport
        state: present
        update_cache: true

    - name: create the TLS directory
      ansible.builtin.file:
        path: /etc/teleport/tls
        state: directory
        mode: "0750"

    - name: place the TLS certificate
      ansible.builtin.copy:
        content: "{{ tls_cert_pem }}"
        dest: /etc/teleport/tls/proxy-cert.pem
        mode: "0640"
      register: tls_cert

    - name: place the TLS private key
      ansible.builtin.copy:
        content: "{{ tls_key_pem }}"
        dest: /etc/teleport/tls/proxy-key.pem
        mode: "0640"
      register: tls_key

    - name: place the pki.issuer/v1 root in the system trust store
      ansible.builtin.copy:
        content: "{{ ca_chain_pem }}"
        dest: /usr/local/share/ca-certificates/genesis-root-ca.crt
        mode: "0644"
      register: ca_chain

    - name: update the system trust store
      ansible.builtin.command: update-ca-certificates
      when: ca_chain.changed

    - name: configure teleport.yaml (Auth + Proxy)
      ansible.builtin.copy:
        content: |
          version: v3
          teleport:
            nodename: {{ node_name }}
            data_dir: /var/lib/teleport
          auth_service:
            enabled: true
            cluster_name: {{ cluster_name }}
            listen_addr: 0.0.0.0:3025
            proxy_listener_mode: multiplex
          proxy_service:
            enabled: true
            web_listen_addr: 0.0.0.0:3080
            public_addr: "{{ vm_ip }}:3080"
            https_keypairs:
              - key_file: /etc/teleport/tls/proxy-key.pem
                cert_file: /etc/teleport/tls/proxy-cert.pem
          ssh_service:
            enabled: false
        dest: /etc/teleport/teleport.yaml
        mode: "0640"
      register: teleport_conf

    - name: enable and (re)start teleport if the configuration changed
      ansible.builtin.systemd:
        name: teleport
        enabled: true
        state: restarted
      when: tls_cert.changed or tls_key.changed or ca_chain.changed or teleport_conf.changed

    - name: make sure teleport is running
      ansible.builtin.systemd:
        name: teleport
        state: started

    - name: wait for the teleport Auth API to answer (tctl status)
      ansible.builtin.command: tctl status --config=/etc/teleport/teleport.yaml
      register: tctl_status
      retries: 30
      delay: 2
      until: tctl_status.rc == 0
      changed_when: false

    - name: show the teleport status (CA pin included, read by the module)
      ansible.builtin.debug:
        var: tctl_status.stdout
