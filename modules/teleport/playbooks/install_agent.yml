# fleet.agent/v1.Install (teleport module, ADR-017): installs the Teleport
# agent (ssh_service only) on a fleet VM and enrols it with a short-lived token
# (join_token/ca_pin/auth_server received from the module). The native sshd
# stays active at this milestone -- the core does not switch its
# core.ansible/v1 runners to the agent yet (deferred Repoint, docs/PROGRESS.md,
# debt tracked by a dedicated issue): disabling it would break every later
# core.ansible/v1 call on this VM (e.g. vault's Handover).
- hosts: target
  gather_facts: true
  become: true
  tasks:
    - name: install the prerequisites
      ansible.builtin.apt:
        name: [gnupg, curl, ca-certificates]
        state: present
        update_cache: true

    - name: create the APT keys directory
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"

    - name: add the Teleport GPG key
      ansible.builtin.get_url:
        url: https://apt.releases.teleport.dev/gpg
        dest: /usr/share/keyrings/teleport-archive-keyring.asc
        mode: "0644"

    - name: add the Teleport repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/teleport-archive-keyring.asc] https://apt.releases.teleport.dev/debian/ {{ ansible_distribution_release | default('bookworm') }} stable/v17"
        state: present
        filename: teleport

    - name: install teleport
      ansible.builtin.apt:
        name: teleport
        state: present
        update_cache: true

    - name: check whether the agent is already enrolled
      ansible.builtin.stat:
        path: /var/lib/teleport/host_uuid
      register: enrolled

    - name: configure teleport.yaml (SSH agent only)
      ansible.builtin.copy:
        content: |
          version: v3
          teleport:
            nodename: {{ node_name }}
            data_dir: /var/lib/teleport
            join_params:
              token_name: {{ join_token }}
              method: token
            ca_pin: {{ ca_pin }}
            auth_server: {{ auth_server }}
          auth_service:
            enabled: false
          proxy_service:
            enabled: false
          ssh_service:
            enabled: true
            listen_addr: 0.0.0.0:3022
        dest: /etc/teleport/teleport.yaml
        mode: "0640"
      when: not enrolled.stat.exists

    - name: enable and start the teleport agent
      ansible.builtin.systemd:
        name: teleport
        enabled: true
        state: restarted
      when: not enrolled.stat.exists

    - name: make sure the agent is running
      ansible.builtin.systemd:
        name: teleport
        state: started
