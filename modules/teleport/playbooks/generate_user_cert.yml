# Verify (teleport module): creates (idempotently) a Teleport verification user
# and signs a short-lived user SSH certificate (tctl auth sign
# --format=openssh) -- the same internal CA as the agents, tctl runs locally on
# teleport's own VM (docs/09-decisions.md ADR-018).
- hosts: target
  gather_facts: false
  become: true
  tasks:
    - name: list the existing teleport users
      ansible.builtin.command: tctl users ls --config=/etc/teleport/teleport.yaml
      register: users_out
      changed_when: false

    - name: create the verification user
      ansible.builtin.command: >
        tctl users add {{ verify_user }} --roles=access --logins={{ ssh_login }}
        --config=/etc/teleport/teleport.yaml
      when: verify_user not in users_out.stdout
      changed_when: true

    - name: sign a short-lived SSH certificate for the verification user
      ansible.builtin.command: >
        tctl auth sign --user={{ verify_user }} --out=/tmp/genesis-verify
        --ttl={{ cert_ttl }} --format=openssh --overwrite
        --config=/etc/teleport/teleport.yaml
      changed_when: true

    - name: read the generated private key
      ansible.builtin.slurp:
        src: /tmp/genesis-verify
      register: priv_key_b64

    - name: read the generated certificate
      ansible.builtin.slurp:
        src: /tmp/genesis-verify-cert.pub
      register: cert_b64

    - name: show the private key (marker for the module)
      ansible.builtin.debug:
        msg: "PRIVATE_KEY_B64:{{ priv_key_b64.content }}"

    - name: show the certificate (marker for the module)
      ansible.builtin.debug:
        msg: "CERTIFICATE_B64:{{ cert_b64.content }}"
