# fleet.agent/v1.Install (teleport module): generates a short-lived enrolment
# token on the Auth+Proxy VM itself (tctl runs locally, Auth API on
# 127.0.0.1:3025) -- one token per enrolment, never reused.
- hosts: target
  gather_facts: false
  become: true
  tasks:
    - name: generate a node join token
      ansible.builtin.command: >
        tctl tokens add --type=node --ttl={{ join_ttl }}
        --config=/etc/teleport/teleport.yaml
      register: token_out
      changed_when: true

    - name: show the token (marker for the module)
      ansible.builtin.debug:
        var: token_out.stdout
