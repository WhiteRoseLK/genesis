---
# Configure (functions/dns/zone/v1 + dns/resolver/v1, powerdns module):
# installs and configures PowerDNS Authoritative (SQLite, API) + Recursor
# (docs/07-mvp-modules.md) — Debian cloud image (docs/01-vision-scope.md).
- hosts: target
  gather_facts: false
  become: true
  vars:
    pdns_db: /var/lib/powerdns/pdns.sqlite3
  tasks:
    - name: install PowerDNS (authoritative, SQLite backend, recursor)
      ansible.builtin.apt:
        name:
          - pdns-server
          - pdns-backend-sqlite3
          - pdns-recursor
          - sqlite3
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 120

    - name: stop pdns-server while the database is prepared
      ansible.builtin.systemd:
        name: pdns
        state: stopped
      failed_when: false

    - name: create the SQLite schema of the authoritative database
      ansible.builtin.command: >
        sqlite3 {{ pdns_db }}
        -init /usr/share/pdns-backend-sqlite3/schema/schema.sqlite3.sql
        -batch .quit
      args:
        creates: "{{ pdns_db }}"
      changed_when: true

    - name: set the database owner
      ansible.builtin.file:
        path: "{{ pdns_db }}"
        owner: pdns
        group: pdns
        mode: "0640"

    - name: configurer pdns.conf (authoritative)
      ansible.builtin.copy:
        content: |
          launch=gsqlite3
          gsqlite3-database={{ pdns_db }}
          api=yes
          api-key={{ api_key }}
          webserver=yes
          webserver-address=0.0.0.0
          webserver-port=8081
          webserver-allow-from=0.0.0.0/0
          local-address=0.0.0.0
          local-port=5300
          disable-axfr=yes
        dest: /etc/powerdns/pdns.conf
        mode: "0640"
        owner: pdns
        group: pdns
      register: pdns_conf

    - name: configurer pdns-recursor.conf
      ansible.builtin.copy:
        content: |
          local-address=0.0.0.0
          local-port=53
          forward-zones={{ domain }}=127.0.0.1:5300,in-addr.arpa=127.0.0.1:5300,10.in-addr.arpa=127.0.0.1:5300,168.192.in-addr.arpa=127.0.0.1:5300
          forward-zones-recurse=.={{ upstream_resolvers | join(';') }}
          allow-from=0.0.0.0/0
          dont-query=
          serve-rfc1918=no
          dnssec=off
        dest: /etc/powerdns/recursor.conf
        mode: "0644"
      register: recursor_conf

    - name: enable and start pdns (authoritative)
      ansible.builtin.systemd:
        name: pdns
        enabled: true
        state: restarted

    - name: disable systemd-resolved stub listener to free port 53
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?DNSStubListener='
        line: 'DNSStubListener=no'
      register: resolved_conf
      failed_when: false

    - name: restart systemd-resolved if stub listener changed
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when: resolved_conf.changed | default(false)
      failed_when: false

    - name: enable and start pdns-recursor
      ansible.builtin.systemd:
        name: pdns-recursor
        enabled: true
        state: restarted
      when: recursor_conf.changed or pdns_conf.changed

    - name: make sure pdns-recursor is running
      ansible.builtin.systemd:
        name: pdns-recursor
        state: started
