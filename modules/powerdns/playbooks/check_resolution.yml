---
# Verify (functions/dns/zone/v1 + dns/resolver/v1, powerdns module): runs on a
# disposable third-party VM, forward + reverse resolution + an external name
# (docs/07-mvp-modules.md: "Verify: forward/reverse resolution from a
# third-party VM + an external name").
- hosts: target
  gather_facts: false
  become: true
  tasks:
    - name: install the DNS verification tools
      ansible.builtin.apt:
        name: dnsutils
        state: present
        update_cache: true

    - name: forward resolution
      ansible.builtin.command: dig @{{ dns_server }} +short {{ forward_name }} A
      register: forward
      changed_when: false

    - name: reverse resolution
      ansible.builtin.command: dig @{{ dns_server }} +short -x {{ reverse_ip }}
      register: reverse
      changed_when: false

    - name: resolve an external name (through the recursor)
      ansible.builtin.command: dig @{{ dns_server }} +short {{ external_name }} A
      register: external
      changed_when: false

    - name: show the results
      ansible.builtin.debug:
        msg:
          forward: "{{ forward.stdout }}"
          reverse: "{{ reverse.stdout }}"
          external: "{{ external.stdout }}"
