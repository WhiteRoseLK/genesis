---
# Configure (functions/time/ntp/v1, chrony module): installs and configures
# chronyd as an NTP server (docs/07-mvp-modules.md) — Debian cloud image
# (docs/01-vision-scope.md), the same assumption as modules/base-os.
- hosts: target
  gather_facts: false
  become: true
  tasks:
    - name: install chrony
      ansible.builtin.apt:
        name: chrony
        state: present
        update_cache: true

    - name: configurer chrony.conf
      ansible.builtin.copy:
        content: |
          {% for pool in ntp_pools %}
          pool {{ pool }} iburst
          {% endfor %}
          allow {{ allow_cidr }}
          local stratum 10
          driftfile /var/lib/chrony/drift
        dest: /etc/chrony/chrony.conf
        mode: "0644"
      register: chrony_conf

    - name: enable and restart chronyd
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: restarted
      when: chrony_conf.changed

    - name: make sure chronyd is running
      ansible.builtin.systemd:
        name: chrony
        state: started
