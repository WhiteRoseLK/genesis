---
# Verify (functions/time/ntp/v1, chrony module): runs on a disposable
# third-party VM pointed at the chrony server to check — "Verify: from another
# VM, source selected, offset < 100 ms" (docs/07-mvp-modules.md).
- hosts: target
  gather_facts: false
  become: true
  tasks:
    - name: install chrony (verification client)
      ansible.builtin.apt:
        name: chrony
        state: present
        update_cache: true

    - name: point chrony at the server to check
      ansible.builtin.copy:
        content: |
          server {{ ntp_server }} iburst
          driftfile /var/lib/chrony/drift
        dest: /etc/chrony/chrony.conf
        mode: "0644"

    - name: restart chronyd
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: restarted

    - name: wait for a usable synchronisation
      ansible.builtin.command: chronyc tracking
      register: tracking
      changed_when: false
      until: "'Not synchronised' not in tracking.stdout"
      retries: 12
      delay: 5

    - name: show chronyc tracking
      ansible.builtin.debug:
        var: tracking.stdout
