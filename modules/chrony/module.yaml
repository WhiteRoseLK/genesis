apiVersion: genesis/module/v1
name: chrony
version: 0.1.0
description: "Time server (docs/07-mvp-modules.md): time.ntp/v1 in the target phase, chronyd installed and configured on its own VM"
layer: foundation
core: ">=0.1.0 <0.3.0"
protocol: 1

capabilities: []

provides:
  - function: time.ntp/v1
    phases: [target]

requires:
  target:
    - function: compute.vm/v1
    - function: os.base/v1
    - function: core.ansible/v1
    - function: core.secrets/v1
    - function: fleet.agent/v1
      optional: true

config_schema: schema.json

secrets: []

resources: []

defaults: {}
