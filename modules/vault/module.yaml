apiVersion: genesis/module/v1
name: vault
version: 0.1.0
description: "Target PKI + secrets (docs/07-mvp-modules.md): pki.issuer/v1 and secrets.kv/v1, single-node Raft, exportable 10-year root CA (pki) and intermediate (pki_int), KV v2, genesis AppRole"
layer: foundation
core: ">=0.1.0"
protocol: 1

capabilities: []

provides:
  - function: pki.issuer/v1
    phases: [target]
  - function: secrets.kv/v1
    phases: [target]

requires:
  target:
    - function: compute.vm/v1
    - function: os.base/v1
    - function: core.ansible/v1
    - function: core.secrets/v1
    - function: time.ntp/v1
    - function: dns.resolver/v1
    - function: pki.issuer/v1@seed
    - function: fleet.agent/v1
      optional: true
    - function: access.ssh/v1
      optional: true

config_schema: schema.json

secrets:
  - { name: root-token, kind: token, rotation: on-handover, recovery: true }
  - { name: unseal-keys, kind: shamir-shares, recovery: true }
  - { name: pki-root-key, kind: private-key, recovery: true }
  - { name: pki-root-cert, kind: certificate, recovery: true }
  - { name: pki-intermediate-cert, kind: certificate, recovery: false }
  - { name: approle-role-id, kind: role-id, recovery: true }
  - { name: approle-secret-id, kind: secret-id, recovery: true }

resources:
  - { role: vault, count: 1, size: medium }

defaults: {}
