---
# Configure (functions/pki/issuer/v1 + secrets/kv/v1, vault module): installs
# Vault (single-node Raft, TLS) — Debian cloud image (docs/01-vision-scope.md),
# official HashiCorp APT repository. Safe to replay during Handover to redeploy
# a new TLS certificate (the apt tasks are idempotent, only the TLS/restart
# changes).
- hosts: target
  gather_facts: true
  become: true
  tasks:
    - name: install the prerequisites
      ansible.builtin.apt:
        name: [gnupg, curl, unzip, ca-certificates, lsb-release]
        state: present
        update_cache: true

    - name: add the HashiCorp GPG key
      ansible.builtin.apt_key:
        url: https://apt.releases.hashicorp.com/gpg
        state: present

    - name: add the HashiCorp repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://apt.releases.hashicorp.com {{ ansible_distribution_release | default('bookworm') }} main"
        state: present
        filename: hashicorp

    - name: install vault
      ansible.builtin.apt:
        name: vault
        state: present
        update_cache: true

    - name: create the TLS directory
      ansible.builtin.file:
        path: /etc/vault.d/tls
        state: directory
        owner: vault
        group: bin
        mode: "0750"

    - name: place the TLS certificate (leaf + chain)
      ansible.builtin.copy:
        content: "{{ tls_cert_pem }}"
        dest: /etc/vault.d/tls/vault-cert.pem
        owner: vault
        group: bin
        mode: "0640"
      register: tls_cert

    - name: place the TLS private key
      ansible.builtin.copy:
        content: "{{ tls_key_pem }}"
        dest: /etc/vault.d/tls/vault-key.pem
        owner: vault
        group: bin
        mode: "0640"
      register: tls_key

    - name: create the raft data directory
      ansible.builtin.file:
        path: /opt/vault/data
        state: directory
        owner: vault
        group: bin
        mode: "0750"

    - name: configure vault.hcl
      ansible.builtin.copy:
        content: |
          storage "raft" {
            path = "/opt/vault/data"
            node_id = "genesis-vault-1"
          }
          listener "tcp" {
            address = "0.0.0.0:8200"
            tls_cert_file = "/etc/vault.d/tls/vault-cert.pem"
            tls_key_file = "/etc/vault.d/tls/vault-key.pem"
          }
          api_addr = "https://{{ vm_ip }}:8200"
          cluster_addr = "https://{{ vm_ip }}:8201"
          disable_mlock = true
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: bin
        mode: "0640"
      register: vault_conf

    - name: enable and restart vault if the configuration changed
      ansible.builtin.systemd:
        name: vault
        enabled: true
        state: restarted
      when: tls_cert.changed or tls_key.changed or vault_conf.changed

    - name: make sure vault is running
      ansible.builtin.systemd:
        name: vault
        state: started
