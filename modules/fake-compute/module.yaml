apiVersion: genesis/module/v1
name: fake-compute
version: 0.1.0
description: "fournit compute.vm/v1 via de vrais conteneurs SSH sur la graine, pour tester le coeur et les modules de service sans hyperviseur (docs/07-modules-mvp.md)"
layer: platform
core: ">=0.1.0 <0.3.0"
protocol: 1

capabilities: [compute]

provides:
  - function: compute.vm/v1
    phases: [target]

requires:
  target:
    - function: core.container/v1

config_schema: schema.json

secrets: []

resources: []

defaults:
  compute: false
