---
# Verify (functions/dns/zone/v1 + dns/resolver/v1, bind module):
# runs on a disposable third-party VM.
- hosts: target
  gather_facts: false
  become: true
  tasks:
    - name: install the DNS verification tools
      ansible.builtin.apt:
        name: dnsutils
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 120

    - name: forward resolution
      ansible.builtin.command: dig @{{ dns_server }} +short {{ forward_name }} A
      register: forward
      changed_when: false

    - name: resolve an external name (through the recursor)
      ansible.builtin.command: dig @{{ dns_server }} +short {{ external_name }} A
      register: external
      changed_when: false

    - name: show the results
      ansible.builtin.debug:
        msg:
          forward: "{{ forward.stdout }}"
          external: "{{ external.stdout }}"
