apiVersion: genesis/module/v1
name: coredns
version: 0.1.0
description: "DNS graine (docs/07-modules-mvp.md) : dns.zone/v1 et dns.resolver/v1 en phase graine, zone regeneree a chaque UpsertRecord"
layer: foundation
core: ">=0.1.0 <0.2.0"
protocol: 1

capabilities: []

provides:
  - function: dns.zone/v1
    phases: [seed]
  - function: dns.resolver/v1
    phases: [seed]

requires:
  seed:
    - function: core.container/v1

config_schema: schema.json

secrets: []

resources: []

defaults: {}
