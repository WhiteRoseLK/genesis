apiVersion: genesis/module/v1
name: coredns
version: 0.1.0
description: "Seed DNS (docs/07-mvp-modules.md): dns.zone/v1 and dns.resolver/v1 in the seed phase, zone regenerated on every UpsertRecord"
layer: foundation
core: ">=0.1.0 <0.3.0"
protocol: 1

capabilities: []

provides:
  - function: dns.zone/v1
    phases: [seed]
  - function: dns.resolver/v1
    phases: [seed]

requires:
  seed:
    - function: core.container/v1

config_schema: schema.json

secrets: []

resources: []

defaults: {}
