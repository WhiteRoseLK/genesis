version: "2"

linters:
  default: standard
  enable:
    - depguard
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - nolintlint
    - unconvert
    - usestdlibvars
  exclusions:
    rules:
      # Tests : fixtures en clair, fichiers et sous-processus de test.
      - path: _test\.go
        linters: [gosec, noctx]
      # Noms de références core.secrets (ex. rootTokenRef = "vault/root-token") :
      # des chemins, pas des valeurs secrètes.
      - linters: [gosec]
        text: G101
        source: 'Ref(Fmt)?\s+=\s+"'
  settings:
    gosec:
      excludes:
        # Piloter des outils existants en ligne de commande (docker/podman,
        # go, step…) est un choix d'architecture (ADR-002) : les arguments
        # viennent du cœur ou du module, jamais d'une entrée non contrôlée.
        - G204
        # Chemins de fichiers issus des options de la CLI ou de la spec :
        # lire le fichier désigné par l'opérateur est le comportement voulu.
        - G304
    depguard:
      rules:
        core-must-not-import-modules:
          files:
            - "**/internal/**"
            - "**/cmd/**"
          deny:
            - pkg: "github.com/WhiteRoseLK/genesis/modules"
              desc: "le cœur (internal/, cmd/) ne doit jamais importer modules/ (docs/02-architecture.md)"
        sdk-must-not-import-core:
          files:
            - "**/sdk/**"
          deny:
            - pkg: "github.com/WhiteRoseLK/genesis/internal"
              desc: "le SDK ne dépend jamais de internal/ (docs/03-contrat-module.md, .claude/rules/sdk.md)"
            - pkg: "github.com/WhiteRoseLK/genesis/cmd"
              desc: "le SDK ne dépend jamais de cmd/ (docs/03-contrat-module.md)"
        modules-must-not-import-core:
          files:
            - "**/modules/**"
            - "**/test/modules/**"
          deny:
            - pkg: "github.com/WhiteRoseLK/genesis/internal"
              desc: "un module n'importe que sdk/ et des bibliothèques tierces, jamais internal/ (docs/03-contrat-module.md, .claude/rules/modules.md)"
            - pkg: "github.com/WhiteRoseLK/genesis/cmd"
              desc: "un module n'importe que sdk/ et des bibliothèques tierces, jamais cmd/ (docs/03-contrat-module.md)"

run:
  go: "1.27"
  # Analyse aussi les tests d'intégration (make test-docker).
  build-tags:
    - docker

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/WhiteRoseLK/genesis
