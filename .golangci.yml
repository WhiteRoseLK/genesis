version: "2"

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        core-must-not-import-modules:
          files:
            - "**/internal/**"
            - "**/cmd/**"
          deny:
            - pkg: "github.com/WhiteRoseLK/genesis/modules"
              desc: "le cœur (internal/, cmd/) ne doit jamais importer modules/ (docs/02-architecture.md)"
        sdk-must-not-import-core:
          files:
            - "**/sdk/**"
          deny:
            - pkg: "github.com/WhiteRoseLK/genesis/internal"
              desc: "le SDK ne dépend jamais de internal/ (docs/03-contrat-module.md, .claude/rules/sdk.md)"
            - pkg: "github.com/WhiteRoseLK/genesis/cmd"
              desc: "le SDK ne dépend jamais de cmd/ (docs/03-contrat-module.md)"
        modules-must-not-import-core:
          files:
            - "**/modules/**"
            - "**/test/modules/**"
          deny:
            - pkg: "github.com/WhiteRoseLK/genesis/internal"
              desc: "un module n'importe que sdk/ et des bibliothèques tierces, jamais internal/ (docs/03-contrat-module.md, .claude/rules/modules.md)"
            - pkg: "github.com/WhiteRoseLK/genesis/cmd"
              desc: "un module n'importe que sdk/ et des bibliothèques tierces, jamais cmd/ (docs/03-contrat-module.md)"

run:
  go: "1.27"
  # Analyse aussi les tests d'intégration (make test-docker).
  build-tags:
    - docker
