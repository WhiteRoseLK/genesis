version: "2"

linters:
  default: standard
  enable:
    - depguard
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - nolintlint
    - unconvert
    - usestdlibvars
  exclusions:
    rules:
      # Tests: plaintext fixtures, test files and subprocesses.
      - path: _test\.go
        linters: [gosec, noctx]
      # core.secrets reference names (e.g. rootTokenRef = "vault/root-token"):
      # paths, not secret values.
      - linters: [gosec]
        text: G101
        source: 'Ref(Fmt)?\s+=\s+"'
  settings:
    gosec:
      excludes:
        # Driving existing command-line tools (docker/podman, go, step…) is
        # an architecture choice (ADR-002): arguments come from the core or
        # the module, never from uncontrolled input.
        - G204
        # File paths from CLI options or the spec: reading the file the
        # operator points to is the intended behaviour.
        - G304
    depguard:
      rules:
        core-must-not-import-modules:
          files:
            - "**/internal/**"
            - "**/cmd/**"
          deny:
            - pkg: "github.com/WhiteRoseLK/genesis/modules"
              desc: "the core (internal/, cmd/) must never import modules/ (docs/02-architecture.md)"
        sdk-must-not-import-core:
          files:
            - "**/sdk/**"
          deny:
            - pkg: "github.com/WhiteRoseLK/genesis/internal"
              desc: "the SDK never depends on internal/ (docs/03-module-contract.md, .claude/rules/sdk.md)"
            - pkg: "github.com/WhiteRoseLK/genesis/cmd"
              desc: "the SDK never depends on cmd/ (docs/03-module-contract.md)"
        modules-must-not-import-core:
          files:
            - "**/modules/**"
            - "**/test/modules/**"
          deny:
            - pkg: "github.com/WhiteRoseLK/genesis/internal"
              desc: "a module imports only sdk/ and third-party libraries, never internal/ (docs/03-module-contract.md, .claude/rules/modules.md)"
            - pkg: "github.com/WhiteRoseLK/genesis/cmd"
              desc: "a module imports only sdk/ and third-party libraries, never cmd/ (docs/03-module-contract.md)"

run:
  go: "1.27"
  # Also analyse the integration tests (make test-docker).
  build-tags:
    - docker

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/WhiteRoseLK/genesis
