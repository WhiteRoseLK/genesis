version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Motifs glob : un nouveau module (modules/<nom>/go.mod) est couvert sans
  # modifier ce fichier (règle d'extensibilité, docs/02-architecture.md).
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/sdk"
      - "/modules/*"
      - "/test/modules/*"
    schedule:
      interval: "weekly"
    # Une PR par dépendance, qui la met à jour dans tous les go.mod à la fois
    # (au lieu d'une PR par répertoire).
    groups:
      go-deps:
        group-by: dependency-name
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
    # Versions refusées : chaque entrée cite sa raison et se retire quand elle
    # ne s'applique plus.
    ignore:
      # grpc 1.84.x réintroduit GO-2026-6443 (CVE-2026-84445, panic serveur,
      # atteignable via le broker) ; corrigé en 1.83.2 (utilisée) et en 1.85.
      - dependency-name: "google.golang.org/grpc"
        versions: ["1.84.x"]
