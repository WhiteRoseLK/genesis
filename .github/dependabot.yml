version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Glob patterns: a new module (modules/<name>/go.mod) is covered without
  # editing this file (extensibility rule, docs/02-architecture.md).
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/sdk"
      - "/modules/*"
      - "/test/modules/*"
    schedule:
      interval: "weekly"
    # One PR per dependency, updating it in every go.mod at once (instead of
    # one PR per directory).
    groups:
      go-deps:
        group-by: dependency-name
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
    # Rejected versions: each entry states its reason and is removed once it
    # no longer applies.
    ignore:
      # grpc 1.84.x reintroduces GO-2026-6443 (CVE-2026-84445, server panic,
      # reachable through the broker); fixed in 1.83.2 (in use) and in 1.85.
      - dependency-name: "google.golang.org/grpc"
        versions: ["1.84.x"]
