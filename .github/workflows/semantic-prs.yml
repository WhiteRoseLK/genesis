name: Semantic PRs

# Les PR sont fusionnées en squash (ADR-021) : le titre devient le commit sur
# main, lu par Release Please. Il doit donc suivre Conventional Commits.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  validate_title:
    name: Validate Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            test
            docs
            ci
            build
            chore
          # Scope libre et facultatif : couche du cœur (engine, broker…), sdk,
          # proto ou nom du module (teleport, vault…). Aucune liste ici :
          # ajouter un module ne modifie rien hors de son répertoire.
          requireScope: false
