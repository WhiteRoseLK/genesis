name: Semantic PRs

# PRs are squash-merged (ADR-021): the title becomes the commit on main,
# which Release Please reads. It must therefore follow Conventional Commits.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  validate_title:
    name: Validate Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            test
            docs
            ci
            build
            chore
          # Free, optional scope: core layer (engine, broker…), sdk, proto or
          # module name (teleport, vault…). No list here: adding a module
          # changes nothing outside its directory.
          requireScope: false
