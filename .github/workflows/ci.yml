name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un nouveau push sur une PR annule l'exécution précédente ; jamais sur main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions épinglées par SHA (version en commentaire, mise à jour par Dependabot).
jobs:
  test:
    name: build & test (détecteur de concurrence)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: make build GOARCH=amd64
      - run: make build GOARCH=arm64
      - run: make test-race

  docker:
    name: tests d'intégration (conteneurs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: make test-docker

  lint:
    name: lint (règles d'import comprises)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - run: make tools
      - run: make lint

  checks:
    name: modules, protobuf, vulnérabilités, licences
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking compare avec la branche de base
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - run: make tools
      - name: go.mod autonomes (hors go.work)
        run: make mod-check
      - name: code protobuf à jour
        run: make proto-check
      - name: contrat protobuf sans rupture (buf breaking)
        if: github.event_name == 'pull_request'
        run: .bin/buf breaking sdk/proto --against ".git#ref=${{ github.event.pull_request.base.sha }},subdir=sdk/proto"
      - name: vulnérabilités (govulncheck)
        run: make vuln
      - name: licences des dépendances
        run: make licenses
