name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the previous run; never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions pinned by SHA (version in a comment, updated by Dependabot).
jobs:
  test:
    name: build & test (détecteur de concurrence)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: make build GOARCH=amd64
      - run: make build GOARCH=arm64
      - run: make test-race

  docker:
    name: tests d'intégration (conteneurs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: pinned images (with retries)
        run: make pull-images
      # Archives downloaded by the tests (Teleport binaries for the locally
      # built test image; the test itself verifies the checksum).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/genesis-test
          key: test-archives-${{ runner.os }}-${{ hashFiles('test/integration/teleport_image_test.go') }}
      - run: make test-docker

  lint:
    name: lint (règles d'import comprises)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - run: make tools
      - run: make lint

  checks:
    name: modules, protobuf, vulnérabilités, licences
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking compares against the base branch
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - run: make tools
      - name: self-contained go.mod files (outside go.work)
        run: make mod-check
      - name: protobuf code up to date
        run: make proto-check
      - name: no breaking protobuf change (buf breaking)
        if: github.event_name == 'pull_request'
        run: .bin/buf breaking sdk/proto --against ".git#ref=${{ github.event.pull_request.base.sha }},subdir=sdk/proto"
      - name: vulnerabilities (govulncheck)
        run: make vuln
      - name: dependency licenses
        run: make licenses
