name: Release Please

# Tient à jour une PR de release (CHANGELOG.md + version) à partir des commits
# de main. GoReleaser (binaires du cœur et des modules) viendra plus tard (ADR-021).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
