name: Release Please

# Keeps one release PR per package (core `vX.Y.Z`, SDK `sdk/vX.Y.Z`) up to
# date from the commits on main. GoReleaser (core and module binaries) will
# come later (ADR-021).
#
# A PR opened with GITHUB_TOKEN does not trigger CI: set the
# RELEASE_PLEASE_TOKEN secret (fine-grained token, contents + pull requests
# permissions on this repository) so that the release PR runs the required
# checks.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
