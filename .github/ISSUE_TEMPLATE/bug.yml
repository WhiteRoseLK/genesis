name: "🐞 Bug"
description: Genesis or a module does not behave as designed.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ Do not paste **any secret** (token, password, key, contents of `genesis.secrets`): mask them before submitting.

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.3.0 or 0cbb6c9
    validations:
      required: true

  - type: input
    id: scope
    attributes:
      label: Affected component
      description: Core layer (engine, broker, spec…) or module (teleport, vault…).
      placeholder: e.g. engine / vault module
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, and the expected behaviour (with a reference to the design document if possible).
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal spec (secrets masked), command run, failing step.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      description: Returned error (module, step, cause) and a useful log excerpt.
      render: text
    validations:
      required: false
