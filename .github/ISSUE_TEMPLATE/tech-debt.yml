name: "🧾 Technical debt"
description: A known limitation, deliberately deferred.
title: ""
labels: ["tech-debt", "needs-triage"]
body:
  - type: input
    id: origin
    attributes:
      label: Originating milestone / ADR
      placeholder: e.g. M8, ADR-019
    validations:
      required: true

  - type: textarea
    id: limitation
    attributes:
      label: Limitation
      description: What is missing or simplified today, and why that is acceptable for now.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Risk / impact
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Possible resolution
    validations:
      required: false
