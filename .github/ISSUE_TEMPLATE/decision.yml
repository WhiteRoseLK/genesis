name: "🧭 Decision"
description: Discuss an architecture or process choice; the decision is recorded as an ADR (docs/adr/).
title: "Decision: "
labels: ["decision"]
body:
  - type: markdown
    attributes:
      value: |
        The discussion happens here. Once settled, the PR that applies the decision adds `docs/adr/NNNN-title.md` (NNNN = this issue's number) and closes the issue. See `docs/09-decisions.md`.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: The problem, the constraints, what makes a decision necessary (related milestone, issues, ADRs).
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options
      description: Each option considered, with its pros and cons.
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: The proposed option and why. The final decision is given in a comment.
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: Changes the module contract (`sdk/`) or the spec format — possibly breaking.
        - label: Adds a heavy dependency.
        - label: Supersedes an existing ADR.
