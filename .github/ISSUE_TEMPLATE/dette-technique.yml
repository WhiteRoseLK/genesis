name: "🧾 Dette technique"
description: Limitation connue, différée volontairement (tracée aussi dans docs/PROGRESS.md).
title: ""
labels: ["dette-technique", "needs-triage"]
body:
  - type: input
    id: origin
    attributes:
      label: Jalon / ADR d'origine
      placeholder: ex. J8, ADR-019
    validations:
      required: true

  - type: textarea
    id: limitation
    attributes:
      label: Limitation
      description: Ce qui manque ou est simplifié aujourd'hui, et pourquoi c'est acceptable pour l'instant.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Risque / impact
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Piste de résolution
    validations:
      required: false
