<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-labelledby="t d">
  <title id="t">Genesis</title>
  <desc id="d">A seed sprouting into an infrastructure foundation: NTP, DNS, PKI, secrets, bastion.</desc>
  <style>
    .bg { fill: #f6f8fa; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .line { stroke: #d1d9e0; }
    .seed { fill: #2da44e; }
    .stem { stroke: #2da44e; }
    .node { fill: #ffffff; stroke: #2da44e; }
    .node-text { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { fill: #f0f6fc; }
      .muted { fill: #9198a1; }
      .line { stroke: #3d444d; }
      .seed { fill: #3fb950; }
      .stem { stroke: #3fb950; }
      .node { fill: #0d1117; stroke: #3fb950; }
      .node-text { fill: #56d364; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  </style>

  <rect class="bg" width="880" height="220" rx="16"/>

  <!-- Sprouting seed: the stem branches out to the foundation services -->
  <g stroke-width="3" fill="none" stroke-linecap="round" class="stem">
    <path d="M150 170 C150 140 150 120 150 100"/>
    <path d="M150 128 C125 118 105 104 92 84"/>
    <path d="M150 116 C175 106 195 92 208 72"/>
    <path d="M150 100 C150 82 150 64 150 48"/>
  </g>
  <ellipse class="seed" cx="150" cy="178" rx="26" ry="14"/>
  <g stroke-width="2.5">
    <circle class="node" cx="92" cy="78" r="17"/>
    <circle class="node" cx="208" cy="66" r="17"/>
    <circle class="node" cx="150" cy="38" r="17"/>
  </g>
  <g class="node-text" font-size="11" font-weight="700" text-anchor="middle">
    <text x="92" y="82">DNS</text>
    <text x="208" y="70">PKI</text>
    <text x="150" y="42">NTP</text>
  </g>

  <line class="line" x1="270" y1="44" x2="270" y2="176" stroke-width="2"/>

  <text class="ink" x="306" y="104" font-size="56" font-weight="700" letter-spacing="-1">Genesis</text>
  <text class="muted" x="308" y="142" font-size="21">One YAML spec. One <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="ink">genesis apply</tspan>.</text>
  <text class="muted" x="308" y="172" font-size="21">A complete infrastructure foundation, then the seed steps aside.</text>
</svg>
