syntax = "proto3";

// Function pki.issuer/v1 (docs/03-module-contract.md): MVP providers
// step-ca (M7, seed) and vault (M7, target).
package functions.pki.issuer.v1;

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/functions/pki/issuer/v1;pkiissuerv1";

service PkiIssuer {
  rpc IssueCert(IssueCertRequest) returns (Certificate);
  rpc SignCSR(SignCSRRequest) returns (Certificate);
  rpc SignSSH(SignSSHRequest) returns (SSHCertificate);
  rpc CAChain(Empty) returns (CAChainResponse);
}

message Empty {}

message IssueCertRequest {
  string common_name = 1;
  repeated string sans = 2;
  int64 ttl_seconds = 3; // 0: the provider's default lifetime
  map<string, string> extra = 4;
}

message SignCSRRequest {
  string csr_pem = 1;
  int64 ttl_seconds = 2; // 0: the provider's default lifetime
  map<string, string> extra = 3;
  // is_ca: signs the CSR as an intermediate (CA) certificate rather than a
  // leaf — needed for another pki.issuer/v1 (e.g. vault) to get its own
  // intermediate signed by this one (docs/07-mvp-modules.md: "pki_int
  // signed by the root").
  bool is_ca = 4;
  // path_len_constraint: how many further levels of intermediates the
  // issued certificate may itself sign (0: leaves only). Ignored if is_ca
  // is false.
  int32 path_len_constraint = 5;
}

// Certificate: private_key_pem is only set by IssueCert (the provider
// generated the pair) — SignCSR returns an empty key, the CSR's private key
// stays with the caller (docs/03 §4 rule 5: a module generates/stores
// secrets only through core.secrets/v1, never elsewhere; the private key of
// an IssueCert must therefore be handed to the caller, which stores it
// itself through core.secrets/v1 if it needs to keep it).
message Certificate {
  string cert_pem = 1;
  string chain_pem = 2; // cert + intermediate(s), without the root
  string private_key_pem = 3;
}

message SignSSHRequest {
  string public_key_openssh = 1;
  string key_id = 2;
  repeated string principals = 3;
  bool host_cert = 4; // host certificate if true, user certificate otherwise
  int64 ttl_seconds = 5;
  map<string, string> extra = 6;
}

message SSHCertificate {
  string certificate_openssh = 1;
}

message CAChainResponse {
  string chain_pem = 1; // intermediate + root, PEM
}
