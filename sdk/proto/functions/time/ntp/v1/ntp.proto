syntax = "proto3";

// Function time.ntp/v1 (docs/03-module-contract.md): MVP provider chrony (target).
package functions.time.ntp.v1;

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/functions/time/ntp/v1;timentpv1";

service TimeNTP {
  rpc Endpoint(Empty) returns (EndpointInfo);
}

message Empty {}

message EndpointInfo {
  string address = 1;
  int32 port = 2;
}
