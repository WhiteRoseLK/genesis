syntax = "proto3";

// Function access.ssh/v1 (docs/03-module-contract.md): SSH access to the
// fleet, provided by a bastion module (teleport). JumpHost exposes the
// public entry point (proxy); SignUserKey will sign a user public key into a
// short-lived SSH certificate -- no real consumer yet at this milestone
// (docs/PROGRESS.md), see modules/teleport.
package functions.access.ssh.v1;

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/functions/access/ssh/v1;accesssshv1";

service AccessSSH {
  rpc JumpHost(Empty) returns (JumpHostInfo);
  rpc SignUserKey(SignUserKeyRequest) returns (SignUserKeyResponse);
}

message Empty {}

message JumpHostInfo {
  string address = 1;
  int32 port = 2;
}

message SignUserKeyRequest {
  string public_key_openssh = 1;
  repeated string principals = 2;
  int64 ttl_seconds = 3;
}

message SignUserKeyResponse {
  string certificate_openssh = 1;
}
