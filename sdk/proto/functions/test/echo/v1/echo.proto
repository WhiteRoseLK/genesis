syntax = "proto3";

// Generic test function, reused under different names (test.a/v1,
// test.b/v1...) by test/modules/test-* to exercise the
// resolver/planner/broker without business logic (docs/08-milestones.md, M4).
package functions.test.echo.v1;

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/functions/test/echo/v1;echov1";

service Echo {
  rpc Call(CallRequest) returns (CallResponse);
}

message CallRequest {
  string message = 1;
}

message CallResponse {
  string message = 1;
  string from = 2;   // name of the module that answers
  string phase = 3;  // "seed" | "target", to check the Handover
}
