syntax = "proto3";

// Function os.base/v1 (docs/03-module-contract.md, docs/07-mvp-modules.md):
// provided by base-os. Harden groups pure hardening (SSH, updates,
// nftables) — deferred, not implemented yet at milestone M5. TrustCA,
// SetResolver and SetNTP carry the functional configuration the VM needs to
// work, implemented from M5.
package functions.os.base.v1;

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/functions/os/base/v1;osbasev1";

service Base {
  rpc Harden(HardenRequest) returns (HardenResponse);
  rpc TrustCA(TrustCARequest) returns (TrustCAResponse);
  rpc SetResolver(SetResolverRequest) returns (SetResolverResponse);
  rpc SetNTP(SetNTPRequest) returns (SetNTPResponse);
}

message Target {
  string host = 1;
  int32 port = 2;
  string user = 3;
  string ssh_private_key = 4;
}

message HardenRequest {
  Target target = 1;
}

message HardenResponse {}

message TrustCARequest {
  Target target = 1;
  string ca_cert_pem = 2;
}

message TrustCAResponse {}

message SetResolverRequest {
  Target target = 1;
  repeated string nameservers = 2;
  string domain = 3;
}

message SetResolverResponse {}

message SetNTPRequest {
  Target target = 1;
  repeated string servers = 2;
}

message SetNTPResponse {}
