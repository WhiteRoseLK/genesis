syntax = "proto3";

// Function core.secrets/v1 (docs/03-module-contract.md, docs/06-secrets-state.md):
// provided natively by the core, never by a module.
package functions.core.secrets.v1;

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/functions/core/secrets/v1;secretsv1";

service Secrets {
  rpc Ensure(EnsureRequest) returns (EnsureResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc List(ListRequest) returns (ListResponse);
}

// Generators provided by the core (docs/06-secrets-state.md). The
// certificate (through pki.issuer) is not in this list: it goes through the
// pki.issuer/v1 function itself, not through a generator here (milestone M7).
enum Generator {
  GENERATOR_UNSPECIFIED = 0;
  GENERATOR_PASSWORD = 1;
  GENERATOR_TOKEN = 2;
  GENERATOR_ECDSA_P384 = 3;
  GENERATOR_ED25519 = 4;
  GENERATOR_SSH_KEYPAIR = 5;
}

message Meta {
  string owner = 1;
  repeated string consumers = 2;
  string kind = 3;
  string rotation = 4;
  bool recovery = 5;
}

message EnsureRequest {
  string ref = 1;
  Generator generator = 2;
  Meta meta = 3;
}

message EnsureResponse {}

message GetRequest {
  string ref = 1;
}

message GetResponse {
  string value = 1;
}

message PutRequest {
  string ref = 1;
  string value = 2;
  Meta meta = 3;
}

message PutResponse {}

message ListRequest {
  string prefix = 1;
}

message Entry {
  string ref = 1;
  Meta meta = 2;
}

message ListResponse {
  repeated Entry entries = 1;
}
