syntax = "proto3";

// Function core.ansible/v1 (docs/03-module-contract.md, ADR-002): provided
// natively by the core, runs a playbook in a container so that Ansible
// never has to be installed on the seed.
package functions.core.ansible.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/functions/core/ansible/v1;ansiblev1";

service Ansible {
  rpc RunPlaybook(RunPlaybookRequest) returns (RunPlaybookResponse);
}

message Target {
  string host = 1;
  int32 port = 2;
  string user = 3;
  string ssh_private_key = 4; // OpenSSH private key, obtained through core.secrets/v1
  // ssh_certificate_pem: signed OpenSSH certificate (e.g. by the Teleport
  // CA, "tctl auth sign --format=openssh") that goes with ssh_private_key —
  // certificate authentication rather than a bare key, with no change to
  // the transport (standard SSH, docs/09-decisions.md ADR-018: Teleport's
  // ssh_service speaks standard SSH on its own port, not a proprietary
  // protocol).
  string ssh_certificate_pem = 5;
}

message RunPlaybookRequest {
  Target target = 1;
  bytes playbook_yaml = 2; // playbook content, provided by the calling module
  google.protobuf.Struct vars = 3; // extra-vars
}

message RunPlaybookResponse {
  bool ok = 1;
  string output = 2; // combined stdout+stderr output, for diagnostics
}
