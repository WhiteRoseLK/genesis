syntax = "proto3";

// Function core.container/v1 (docs/03-module-contract.md): provided
// natively by the core, on the seed. The detected runtime (docker or
// podman, docs/04-spec.md: seed.container_runtime) is driven through its
// command line.
package functions.core.container.v1;

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/functions/core/container/v1;containerv1";

service Container {
  rpc Run(RunRequest) returns (RunResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message Mount {
  string host_path = 1;
  string container_path = 2;
  bool read_only = 3;
}

// File is a file exchanged with a blocking container, through the
// container's layer: never written to the seed's disk (keys, passwords).
message File {
  string path = 1; // absolute path in the container
  bytes content = 2;
}

message RunRequest {
  string name = 1; // optional, generated when empty
  string image = 2;
  repeated string command = 3;
  map<string, string> env = 4;
  repeated Mount mounts = 5;
  // detach=false (default): Run blocks until the container exits and
  // returns its output (e.g. running ansible-playbook). detach=true: Run
  // starts a service and returns immediately (e.g. CoreDNS in M6), to be
  // driven afterwards with Stop/Status.
  bool detach = 6;
  // files: placed in the container before it starts. collect: read back
  // after it exits, returned in RunResponse.collected if exit_code == 0.
  // Blocking mode (detach=false) only.
  repeated File files = 7;
  repeated string collect = 8;
}

message RunResponse {
  string container_id = 1;
  int32 exit_code = 2; // only valid if detach=false
  string stdout = 3;
  string stderr = 4;
  string ip = 5; // container IP address on its network, valid if detach=true
  repeated File collected = 6;
}

message StopRequest {
  string container_id = 1;
}

message StopResponse {}

message StatusRequest {
  string container_id = 1;
}

message StatusResponse {
  string state = 1; // running | exited | unknown
  int32 exit_code = 2;
}
