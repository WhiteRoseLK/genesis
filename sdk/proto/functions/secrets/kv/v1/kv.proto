syntax = "proto3";

// Fonction secrets.kv/v1 (docs/03-contrat-module.md, docs/06-secrets-etat.md) :
// fournisseur MVP vault (J7, target) — moteur KV v2, chemin
// genesis/<env>/<ref>, authentifié par AppRole côté appelant (le cœur, pour
// la migration file->vault ; un module ne lit ses propres secrets que via
// core.secrets/v1, jamais directement secrets.kv/v1).
package functions.secrets.kv.v1;

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/functions/secrets/kv/v1;secretskvv1";

service SecretsKV {
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message ReadRequest {
  string ref = 1;
}

message ReadResponse {
  string value = 1;
  bool found = 2;
}

message WriteRequest {
  string ref = 1;
  string value = 2;
}

message WriteResponse {}

message ListRequest {
  string prefix = 1;
}

message ListResponse {
  repeated string refs = 1;
}
