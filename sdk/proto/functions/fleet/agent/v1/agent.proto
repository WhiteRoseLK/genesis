syntax = "proto3";

// Fonction fleet.agent/v1 (docs/02-architecture.md, docs/09-decisions.md
// ADR-017) : fonction « de parc » — tous les fournisseurs installés sont
// appelés (diffusion), pas un seul fournisseur actif comme les autres
// fonctions. Fournisseur MVP : teleport (J8).
package functions.fleet.agent.v1;

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/functions/fleet/agent/v1;fleetagentv1";

service FleetAgent {
  rpc Install(InstallRequest) returns (InstallResponse);
}

message Target {
  string host = 1;
  int32 port = 2;
  string user = 3;
  string ssh_private_key = 4; // clé privée OpenSSH, obtenue via core.secrets/v1
}

message InstallRequest {
  Target target = 1;
}

message InstallResponse {}
