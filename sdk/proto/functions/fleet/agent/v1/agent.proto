syntax = "proto3";

// Function fleet.agent/v1 (docs/02-architecture.md, docs/09-decisions.md
// ADR-017): a "fleet" function — every installed provider is called
// (fan-out), not a single active provider as for the other functions. MVP
// provider: teleport (M8).
package functions.fleet.agent.v1;

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/functions/fleet/agent/v1;fleetagentv1";

service FleetAgent {
  rpc Install(InstallRequest) returns (InstallResponse);
}

message Target {
  string host = 1;
  int32 port = 2;
  string user = 3;
  string ssh_private_key = 4; // OpenSSH private key, obtained through core.secrets/v1
}

message InstallRequest {
  Target target = 1;
}

message InstallResponse {}
