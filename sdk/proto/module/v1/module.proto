syntax = "proto3";

// Module <-> core lifecycle protocol (docs/03-module-contract.md).
// Naming: package "module.v1" (no "genesis." prefix) so that the
// sdk/proto/module/v1/ directory matches the package (buf convention).
package module.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/WhiteRoseLK/genesis/sdk/go/gen/module/v1;modulev1";

service Module {
  rpc Describe(Empty) returns (Manifest);
  rpc Validate(ValidateRequest) returns (Diagnostics);
  rpc Check(StepRequest) returns (CheckResult);
  rpc SeedUp(StepRequest) returns (StepResult);
  rpc SeedDown(StepRequest) returns (StepResult);
  rpc Provision(StepRequest) returns (StepResult);
  rpc Configure(StepRequest) returns (StepResult);
  rpc Verify(StepRequest) returns (StepResult);
  rpc Handover(StepRequest) returns (StepResult);
  rpc Repoint(RepointRequest) returns (StepResult);
  rpc Destroy(StepRequest) returns (StepResult);
}

message Empty {}

// FunctionRef identifies a provided function, with the phases in which it is
// provided.
message FunctionRef {
  string function = 1; // e.g. "pki.issuer/v1"
  repeated string phases = 2; // "seed" | "target"
}

// RequireEntry is a function the module requires for a given phase.
message RequireEntry {
  string function = 1; // e.g. "compute.vm/v1", may carry the "@seed"/"@target" suffix
  bool optional = 2; // docs/10-adding-a-module.md: optional dependencies
}

message RequireList {
  repeated RequireEntry entries = 1;
}

message SecretDecl {
  string name = 1;
  string kind = 2; // password | token | private-key | certificate | ssh-key
  string rotation = 3; // never | on-handover | 90d …
  bool recovery = 4;
}

message ResourceDecl {
  string role = 1;
  int32 count = 2;
  string size = 3;
}

// Manifest mirrors module.yaml (docs/03-module-contract.md §1).
message Manifest {
  string api_version = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  string layer = 5;
  string core = 6; // semver constraint on the core
  int32 protocol = 7; // version of the module <-> core gRPC protocol
  repeated string capabilities = 8;
  repeated FunctionRef provides = 9;
  map<string, RequireList> requires = 10; // key: "seed" | "target"
  string config_schema = 11; // path of the JSON Schema, relative to the module
  repeated SecretDecl secrets = 12;
  repeated ResourceDecl resources = 13;
  map<string, bool> defaults = 14;
}

message ValidateRequest {
  google.protobuf.Struct config = 1; // spec section resolved for this module
}

message Diagnostic {
  string path = 1; // YAML path concerned, if applicable
  string message = 2;
  string severity = 3; // error | warning
}

message Diagnostics {
  repeated Diagnostic diagnostics = 1;
}

// StepRequest carries everything a module needs to run a step
// (docs/03-module-contract.md §2): the core gives it access to nothing else.
message StepRequest {
  string run_id = 1;
  google.protobuf.Struct config = 2; // the module's resolved configuration
  google.protobuf.Struct state = 3; // the module's own slice of the state, opaque to the core
  string broker_token = 4; // broker access token, limited to the declared functions (M4)
}

message RepointRequest {
  StepRequest step = 1;
  string function = 2; // function whose provider has just changed
}

message Endpoint {
  string address = 1;
  int32 port = 2;
  map<string, string> extra = 3;
}

message CheckResult {
  // The English names come first: they are the canonical names (Go String(),
  // JSON). The original French names stay as aliases of the same numbers so
  // that existing modules keep compiling; they will be removed in a breaking
  // release (ADR-054).
  enum Status {
    option allow_alias = true;
    STATUS_UNSPECIFIED = 0;
    STATUS_COMPLIANT = 1;
    STATUS_TODO = 2;
    STATUS_DRIFT = 3;
    STATUS_CONFORME = 1 [deprecated = true];
    STATUS_A_FAIRE = 2 [deprecated = true];
    STATUS_DERIVE = 3 [deprecated = true];
  }
  Status status = 1;
  string detail = 2;
}

// StepResult: the module persists nothing itself; state is to be persisted
// by the core, opaque (docs/03-module-contract.md §2).
message StepResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_FAILED = 2;
  }
  Status status = 1;
  google.protobuf.Struct state = 2;
  repeated Endpoint endpoints = 3;
  repeated Diagnostic diagnostics = 4;
}
