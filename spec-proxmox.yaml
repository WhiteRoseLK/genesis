apiVersion: genesis/v1alpha1
kind: Environment
metadata:
  name: lab
network:
  cidr: 192.168.1.0/24
  gateway: 192.168.1.254
  pool: 192.168.1.210-192.168.1.220
  domain: lab.internal
  upstream_dns: [1.1.1.1, 9.9.9.9]
  upstream_ntp: [0.fr.pool.ntp.org, 1.fr.pool.ntp.org]
seed:
  address: 192.168.1.47
  container_runtime: auto
  state_dir: .state
capabilities:
  compute:
    module: proxmox
    config:
      endpoint: https://192.168.1.200:8006
      node: proxmox
      storage: SSD
      bridge: vmbr0
      image: genesis-template
      vmid_min: 3000
      full_clone: true
      tls_insecure: true
      credentials:
        token_id: genesis@pam!genesis
        token_secret: 772cc45f-9cb5-48f1-89ae-34c4c8fe62b1
  time:
    module: chrony
  dns:
    module: powerdns
  pki:
    module: vault
  secrets:
    module: vault
